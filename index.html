<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omnistore Black Edition</title>
    <style>
        /* ==========================================
           1. VARIÁVEIS - TEMA BLACK & BLUE
           ========================================== */
        :root {
            --bg-app: #000000;         
            --bg-card: #0A0A0C;        
            --bg-nav: #0A0A0C;         
            --bg-input: #121214;       
            
            --primary: #007AFF;        
            --primary-hover: #0056b3;
            --success: #32D74B;        
            --danger: #FF453A;         
            
            --text-main: #FFFFFF;      
            --text-secundary: #8E8E93; 
            --border: #1C1C1E;         
            
            --radius-card: 16px;
            --radius-input: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-app);
        }

        svg {
            display: inline-block;
            vertical-align: middle;
        }

        /* ==========================================
           2. CABEÇALHO
           ========================================== */
        header {
            padding: 30px 20px 15px;
            background-color: var(--bg-app);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ==========================================
           3. ÁREA DE CONTEÚDO E CARTÕES
           ========================================== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 100px 20px;
        }

        .tela { display: none; animation: fadeIn 0.2s ease forwards; opacity: 0; }
        .tela.ativa { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secundary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ==========================================
           4. PAINEL DE INÍCIO
           ========================================== */
        .user-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 44px;
            height: 44px;
            background-color: rgba(0, 122, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
        }
        .user-text span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secundary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .user-text strong {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
        }
        .date-badge {
            background-color: var(--bg-input);
            color: var(--text-secundary);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
        }

        .balance-section { text-align: center; padding: 20px 0; }
        .balance-section .label { font-size: 0.75rem; color: var(--text-secundary); display: block; margin-bottom: 5px; }
        .balance-section .value { font-size: 2.5rem; font-weight: 600; color: var(--success); letter-spacing: -1px; }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .dash-card {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .dash-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .dash-card .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dash-card h3 { color: var(--text-secundary); font-size: 0.75rem; margin-bottom: 4px; font-weight: 500;}
        .dash-card span { color: var(--text-main); font-size: 1.3rem; font-weight: 600; }

        /* ==========================================
           5. FORMULÁRIOS
           ========================================== */
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secundary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-input);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            background-color: #1a1a1c;
        }

        .input-row { display: flex; gap: 10px; }

        .btn-acao {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-input);
            font-size: 0.95rem;
            font-weight: 600;
            color: #FFFFFF;
            background-color: var(--primary);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-acao:active { transform: scale(0.98); background-color: var(--primary-hover); }
        .btn-secundario { background-color: transparent; border: 1px solid var(--border); color: var(--primary); }
        .btn-perigo { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }

        /* ==========================================
           6. ITENS E LISTAS
           ========================================== */
        .resultados-container { display: flex; flex-direction: column; gap: 12px; }

        .item-salvo {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
        }

        .caminho-categoria {
            display: inline-flex;
            align-items: center;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 8px;
            gap: 4px;
        }

        .item-salvo strong { display: block; font-size: 1.05rem; margin-bottom: 6px; color: var(--text-main); }
        .item-salvo p { color: var(--text-secundary); font-size: 0.9rem; line-height: 1.4; }
        .item-salvo img { width: 100%; border-radius: 8px; margin-top: 12px; border: 1px solid var(--border); }
        .destaque { font-size: 1.2rem; color: var(--success); font-weight: 600; display: block; margin-top: 8px; }

        .acoes-item {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        
        .btn-pequeno {
            background: transparent; border: 1px solid var(--border); font-weight: 500;
            font-size: 0.8rem; cursor: pointer; padding: 6px 12px; border-radius: 6px; color: var(--text-main);
        }
        .btn-excluir { color: var(--danger); }

        /* ==========================================
           7. GESTÃO DE CATEGORIAS (TELA DEDICADA)
           ========================================== */
        .cat-manager-card {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cat-header strong { color: var(--text-main); font-size: 1rem; }
        
        .subcat-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .subcat-badge {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; color: var(--text-secundary);
            display: flex; align-items: center; gap: 6px;
        }
        .remover-btn { color: var(--danger); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; background: none; border: none;}

        /* ==========================================
           8. MENU INFERIOR (5 ABAS COM CATEGORIAS)
           ========================================== */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; max-width: 500px;
            height: 80px; background-color: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
            padding-bottom: 15px;
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; width: 20%; cursor: pointer; 
            color: var(--text-secundary); transition: 0.2s;
        }
        .nav-item.ativo { color: var(--primary); }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}
        .nav-item span.label { font-size: 0.6rem; font-weight: 500; }

        /* ==========================================
           9. TELA DE EDIÇÃO
           ========================================== */
        #tela-edicao-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); z-index: 200; display: none; flex-direction: column;
        }
        .edicao-header { padding: 30px 20px 20px; display: flex; align-items: center; background: var(--bg-app); border-bottom: 1px solid var(--border); }
        .btn-voltar { background: none; border: none; color: var(--primary); font-size: 1rem; cursor: pointer; margin-right: 15px; display: flex; align-items: center; gap: 5px;}
        .edicao-body { padding: 20px; flex: 1; overflow-y: auto; }
        
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

    <div class="app-container" id="app-principal">
        
        <header id="main-header" style="display: none;">
            <h1 id="header-title">Omnistore</h1>
        </header>

        <div class="content-area">
            
            <div id="tela-inicio" class="tela ativa">
                
                <div class="card" style="margin-top: 5px;">
                    <div class="user-panel">
                        <div class="user-info">
                            <div class="user-avatar">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <div class="user-text">
                                <span>Visão Geral</span>
                                <strong>Seu Painel</strong>
                            </div>
                        </div>
                        <div class="date-badge" id="dataAtualBadge">00/00</div>
                    </div>
                </div>

                <div class="card">
                    <div class="balance-section">
                        <span class="label">Total de Vendas Acumuladas</span>
                        <div class="value" id="dashTotalVendas">R$ 0,00</div>
                    </div>
                </div>

                <div class="dash-grid">
                    <div class="dash-card">
                        <div class="header">
                            <div class="icon-box" style="background: rgba(0, 122, 255, 0.1); color: var(--primary);">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            </div>
                        </div>
                        <h3>Total de Notas</h3>
                        <span id="dashTotalNotas">0</span>
                    </div>

                    <div class="dash-card">
                        <div class="header">
                            <div class="icon-box" style="background: rgba(255, 149, 0, 0.1); color: #FF9500;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            </div>
                        </div>
                        <h3>Próximo Evento</h3>
                        <span id="dashProximoEvento" style="font-size: 0.85rem; font-weight: normal; margin-top: 4px;">Nenhum.</span>
                    </div>
                </div>
            </div>

            <div id="tela-conteudo" class="tela">
                <div class="card">
                    <h2 class="section-title">Nova Nota</h2>
                    
                    <div class="input-row">
                        <div class="form-group" style="flex: 1;">
                            <label>Categoria</label>
                            <select id="categoriaConteudo" onchange="atualizarSelectSubcategorias('categoriaConteudo', 'subcategoriaConteudo')"></select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Subcategoria</label>
                            <select id="subcategoriaConteudo"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="tituloConteudo" placeholder="Assunto principal">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="textoConteudo" rows="3" placeholder="Detalhes da nota..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Anexar Imagem (Opcional)</label>
                        <input type="file" id="imagemConteudo" accept="image/*" style="padding: 10px; font-size: 0.8rem;">
                    </div>
                    <button class="btn-acao" onclick="salvarConteudo()">Salvar Nota</button>
                </div>
                <div class="resultados-container" id="listaConteudos"></div>
            </div>

            <div id="tela-agenda" class="tela">
                <div class="card">
                    <h2 class="section-title">Novo Evento</h2>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="dataAgenda" style="color-scheme: dark;">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="descAgenda" placeholder="Título do evento">
                    </div>
                    <button class="btn-acao" onclick="salvarAgenda()">Agendar</button>
                </div>
                <div class="resultados-container" id="listaAgenda"></div>
            </div>

            <div id="tela-vendas" class="tela">
                <div class="card">
                    <h2 class="section-title">Registrar Venda</h2>
                    <div class="form-group">
                        <label>Produto / Serviço</label>
                        <input type="text" id="nomeProduto" placeholder="Nome do item">
                    </div>
                    <div class="form-group input-row">
                        <div style="flex: 1;">
                            <label>Quantidade</label>
                            <input type="number" id="qtdProduto" placeholder="1">
                        </div>
                        <div style="flex: 2;">
                            <label>Preço Unitário (R$)</label>
                            <input type="number" id="precoProduto" placeholder="0,00" step="0.01">
                        </div>
                    </div>
                    <button class="btn-acao" onclick="salvarVenda()">Confirmar</button>
                </div>
                <div class="resultados-container" id="listaVendas"></div>
            </div>

            <div id="tela-categorias" class="tela">
                <div class="card">
                    <h2 class="section-title">Nova Categoria Principal</h2>
                    <div class="input-row">
                        <input type="text" id="novaCategoriaNome" placeholder="Ex: Finanças, Pessoal...">
                        <button class="btn-acao" style="width: auto; padding: 0 20px;" onclick="addCategoria()">Criar</button>
                    </div>
                </div>

                <div class="card">
                    <h2 class="section-title">Gerenciar Categorias & Subcategorias</h2>
                    <div id="listaGestaoCategorias"></div>
                </div>
            </div>

            <div id="tela-config" class="tela">
                <div class="card" style="border-color: rgba(255, 69, 58, 0.2);">
                    <h2 class="section-title" style="color: var(--danger);">Zona de Perigo</h2>
                    <button class="btn-acao btn-perigo" onclick="limparTodosDados()">Apagar Todos os Dados</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item ativo" onclick="abrirTela('tela-inicio', 'Início', this)">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="label">Início</span>
            </div>
            <div class="nav-item" onclick="abrirTela('tela-conteudo', 'Notas', this)">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                <span class="label">Notas</span>
            </div>
            <div class="nav-item" onclick="abrirTela('tela-agenda', 'Agenda', this)">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span class="label">Agenda</span>
            </div>
            <div class="nav-item" onclick="abrirTela('tela-vendas', 'Vendas', this)">
                <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                <span class="label">Vendas</span>
            </div>
            <div class="nav-item" onclick="abrirTela('tela-categorias', 'Categorias', this)">
                <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                <span class="label">Categorias</span>
            </div>
        </nav>
    </div>

    <div id="tela-edicao-container">
        <div class="edicao-header">
            <button class="btn-voltar" onclick="fecharEdicao()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Voltar
            </button>
            <h2 style="font-size: 1rem; margin-left: auto; margin-right: auto; padding-right: 40px;">Editar</h2>
        </div>
        <div class="edicao-body">
            <div class="card" id="formulario-edicao-dinamico"></div>
        </div>
    </div>

    <script>
        function obterDados(chave) { return JSON.parse(localStorage.getItem(chave)) || []; }
        function salvarDados(chave, dados) { localStorage.setItem(chave, JSON.stringify(dados)); }
        function gerarId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        window.onload = function() {
            migrarCategoriasAntigas(); 
            inicializarSistema();
            setarDataBadge();
        }

        function setarDataBadge() {
            const data = new Date();
            document.getElementById('dataAtualBadge').innerText = data.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
        }

        function inicializarSistema() {
            renderizarGestorCategorias();
            preencherSelectCategorias('categoriaConteudo');
            atualizarSelectSubcategorias('categoriaConteudo', 'subcategoriaConteudo');
            renderizarListas();
            atualizarDashboard();
        }

        function abrirTela(idTela, titulo, botao) {
            document.querySelectorAll('.app-container .tela').forEach(t => t.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('ativo'));
            
            document.getElementById(idTela).classList.add('ativa');
            botao.classList.add('ativo');
            
            const header = document.getElementById('main-header');
            if(idTela === 'tela-inicio') {
                header.style.display = 'none';
                atualizarDashboard();
            } else {
                header.style.display = 'block';
                document.getElementById('header-title').innerText = titulo;
            }
        }

        function limparTodosDados() {
            if(confirm("Confirma a exclusão de TODOS os dados?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        // Categorias
        function migrarCategoriasAntigas() {
            let cat = obterDados('categorias');
            if(cat.length === 0) {
                salvarDados('categorias', [
                    { id: gerarId(), nome: 'Trabalho', subs: ['Projetos', 'Reuniões'] },
                    { id: gerarId(), nome: 'Pessoal', subs: ['Ideias'] }
                ]);
            }
        }

        function renderizarGestorCategorias() {
            let categorias = obterDados('categorias');
            let divGestor = document.getElementById('listaGestaoCategorias');
            divGestor.innerHTML = '';

            categorias.forEach(cat => {
                let subsHTML = cat.subs.map((sub, index) => 
                    `<span class="subcat-badge">${sub} <button class="remover-btn" onclick="removerSubcategoria('${cat.id}', ${index})"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></span>`
                ).join('');

                divGestor.innerHTML += `
                    <div class="cat-manager-card">
                        <div class="cat-header">
                            <strong>${cat.nome}</strong>
                            <button class="remover-btn" onclick="removerCategoria('${cat.id}')">Excluir</button>
                        </div>
                        <div class="subcat-list">${subsHTML}</div>
                        <div class="input-row">
                            <input type="text" id="novaSub_${cat.id}" placeholder="Nova Subcategoria..." style="padding: 10px; font-size: 0.8rem;">
                            <button class="btn-acao btn-secundario" style="width: auto; padding: 0 14px; font-size: 0.8rem;" onclick="addSubcategoria('${cat.id}')">Add</button>
                        </div>
                    </div>
                `;
            });
        }

        function addCategoria() {
            let input = document.getElementById('novaCategoriaNome');
            let nome = input.value.trim();
            if(!nome) return;
            let cat = obterDados('categorias');
            cat.push({ id: gerarId(), nome: nome, subs: [] });
            salvarDados('categorias', cat);
            input.value = '';
            atualizarSistemaDeCategorias();
        }

        function removerCategoria(id) {
            let cat = obterDados('categorias');
            if(cat.length <= 1) return alert("Mantenha ao menos uma categoria principal.");
            if(confirm("Excluir categoria?")) {
                salvarDados('categorias', cat.filter(c => c.id !== id));
                atualizarSistemaDeCategorias();
            }
        }

        function addSubcategoria(catId) {
            let input = document.getElementById(`novaSub_${catId}`);
            let subNome = input.value.trim();
            if(!subNome) return;
            let cat = obterDados('categorias');
            let categoria = cat.find(c => c.id === catId);
            if(!categoria.subs.includes(subNome)) {
                categoria.subs.push(subNome);
                salvarDados('categorias', cat);
                atualizarSistemaDeCategorias();
            }
        }

        function removerSubcategoria(catId, subIndex) {
            let cat = obterDados('categorias');
            cat.find(c => c.id === catId).subs.splice(subIndex, 1);
            salvarDados('categorias', cat);
            atualizarSistemaDeCategorias();
        }

        function atualizarSistemaDeCategorias() {
            renderizarGestorCategorias();
            preencherSelectCategorias('categoriaConteudo');
            atualizarSelectSubcategorias('categoriaConteudo', 'subcategoriaConteudo');
        }

        function preencherSelectCategorias(selectId, valorSelecionado = '') {
            let select = document.getElementById(selectId);
            if(!select) return;
            let categorias = obterDados('categorias');
            select.innerHTML = '';
            categorias.forEach(cat => {
                let selected = (cat.nome === valorSelecionado) ? 'selected' : '';
                select.innerHTML += `<option value="${cat.nome}" data-id="${cat.id}" ${selected}>${cat.nome}</option>`;
            });
        }

        function atualizarSelectSubcategorias(idSelectCat, idSelectSub, valorSelecionadoSub = '') {
            let selectCat = document.getElementById(idSelectCat);
            let selectSub = document.getElementById(idSelectSub);
            if(!selectCat || !selectSub) return;
            let categoriaObj = obterDados('categorias').find(c => c.nome === selectCat.value);
            selectSub.innerHTML = '<option value="">Sem subcategoria</option>';
            if(categoriaObj && categoriaObj.subs.length > 0) {
                categoriaObj.subs.forEach(sub => {
                    let selected = (sub === valorSelecionadoSub) ? 'selected' : '';
                    selectSub.innerHTML += `<option value="${sub}" ${selected}>${sub}</option>`;
                });
            }
        }

        // Notas
        async function salvarConteudo() {
            let categoria = document.getElementById('categoriaConteudo').value;
            let subcategoria = document.getElementById('subcategoriaConteudo').value;
            let titulo = document.getElementById('tituloConteudo').value;
            let texto = document.getElementById('textoConteudo').value;
            let arquivo = document.getElementById('imagemConteudo').files[0];
            
            if (!titulo || !texto) return;

            let base64Imagem = "";
            if (arquivo) {
                base64Imagem = await new Promise(resolve => {
                    let reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(arquivo);
                });
            }

            let notas = obterDados('conteudos');
            notas.push({ id: gerarId(), categoria, subcategoria, titulo, texto, imagem: base64Imagem });
            salvarDados('conteudos', notas);
            
            document.getElementById('tituloConteudo').value = '';
            document.getElementById('textoConteudo').value = '';
            document.getElementById('imagemConteudo').value = '';
            renderizarNotas();
            atualizarDashboard();
        }

        function renderizarNotas() {
            let div = document.getElementById('listaConteudos');
            let notas = obterDados('conteudos');
            div.innerHTML = notas.length === 0 ? '<p style="color:var(--text-secundary);text-align:center; font-size:0.9rem;">Lista vazia.</p>' : '';
            
            notas.slice().reverse().forEach(nota => {
                let imgTag = nota.imagem ? `<img src="${nota.imagem}">` : '';
                let catTexto = nota.categoria || 'Geral';
                if(nota.subcategoria) catTexto += ` • ${nota.subcategoria}`;

                div.innerHTML += `
                    <div class="item-salvo">
                        <span class="caminho-categoria">${catTexto}</span>
                        <strong>${nota.titulo}</strong>
                        <p>${nota.texto.replace(/\n/g, '<br>')}</p>
                        ${imgTag}
                        <div class="acoes-item">
                            <button class="btn-pequeno" onclick="abrirTelaEdicao('conteudos', '${nota.id}')">Editar</button>
                            <button class="btn-pequeno btn-excluir" onclick="excluirItem('conteudos', '${nota.id}')">Excluir</button>
                        </div>
                    </div>`;
            });
        }

        // Edição
        let itemEmEdicao = null;
        let tipoEmEdicao = '';

        function abrirTelaEdicao(tipo, id) {
            tipoEmEdicao = tipo;
            itemEmEdicao = obterDados(tipo).find(item => item.id === id);
            let formHTML = '';
            
            if (tipo === 'conteudos') {
                formHTML = `
                    <div class="input-row">
                        <div class="form-group" style="flex: 1;"><label>Categoria</label><select id="editCategoria" onchange="atualizarSelectSubcategorias('editCategoria', 'editSubcategoria')"></select></div>
                        <div class="form-group" style="flex: 1;"><label>Subcategoria</label><select id="editSubcategoria"></select></div>
                    </div>
                    <div class="form-group"><label>Título</label><input type="text" id="editTitulo" value="${itemEmEdicao.titulo}"></div>
                    <div class="form-group"><label>Descrição</label><textarea id="editTexto" rows="4">${itemEmEdicao.texto}</textarea></div>
                    <div class="form-group"><label>Nova Imagem</label><input type="file" id="editImagem" accept="image/*" style="padding: 10px;"></div>
                `;
            } else if (tipo === 'agenda') {
                formHTML = `
                    <div class="form-group"><label>Data</label><input type="date" id="editData" value="${itemEmEdicao.data}" style="color-scheme: dark;"></div>
                    <div class="form-group"><label>Descrição</label><input type="text" id="editDesc" value="${itemEmEdicao.desc}"></div>
                `;
            } else if (tipo === 'vendas') {
                formHTML = `
                    <div class="form-group"><label>Produto</label><input type="text" id="editProduto" value="${itemEmEdicao.produto}"></div>
                    <div class="form-group input-row">
                        <div><label>Qtd</label><input type="number" id="editQtd" value="${itemEmEdicao.qtd}"></div>
                        <div><label>Preço</label><input type="number" id="editPreco" value="${itemEmEdicao.preco}" step="0.01"></div>
                    </div>
                `;
            }

            formHTML += `<button class="btn-acao" onclick="salvarEdicao()" style="margin-top: 10px;">Salvar Alterações</button>`;
            
            document.getElementById('formulario-edicao-dinamico').innerHTML = formHTML;
            document.getElementById('app-principal').style.display = 'none';
            document.getElementById('tela-edicao-container').style.display = 'flex';

            if(tipo === 'conteudos') {
                preencherSelectCategorias('editCategoria', itemEmEdicao.categoria);
                atualizarSelectSubcategorias('editCategoria', 'editSubcategoria', itemEmEdicao.subcategoria);
            }
        }

        function fecharEdicao() {
            document.getElementById('tela-edicao-container').style.display = 'none';
            document.getElementById('app-principal').style.display = 'flex';
        }

        async function salvarEdicao() {
            let lista = obterDados(tipoEmEdicao);
            let index = lista.findIndex(i => i.id === itemEmEdicao.id);

            if (tipoEmEdicao === 'conteudos') {
                lista[index].categoria = document.getElementById('editCategoria').value;
                lista[index].subcategoria = document.getElementById('editSubcategoria').value;
                lista[index].titulo = document.getElementById('editTitulo').value;
                lista[index].texto = document.getElementById('editTexto').value;
                
                let arquivo = document.getElementById('editImagem').files[0];
                if(arquivo) {
                    lista[index].imagem = await new Promise(resolve => {
                        let reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.readAsDataURL(arquivo);
                    });
                }
            } else if (tipoEmEdicao === 'agenda') {
                lista[index].data = document.getElementById('editData').value;
                lista[index].desc = document.getElementById('editDesc').value;
            } else if (tipoEmEdicao === 'vendas') {
                lista[index].produto = document.getElementById('editProduto').value;
                lista[index].qtd = parseInt(document.getElementById('editQtd').value);
                lista[index].preco = parseFloat(document.getElementById('editPreco').value);
            }

            salvarDados(tipoEmEdicao, lista);
            renderizarListas();
            atualizarDashboard();
            fecharEdicao();
        }

        function excluirItem(chave, id) {
            if(confirm("Excluir este item?")) {
                salvarDados(chave, obterDados(chave).filter(item => item.id !== id));
                renderizarListas();
                atualizarDashboard();
            }
        }

        function renderizarListas() { renderizarNotas(); renderizarAgenda(); renderizarVendas(); }

        function atualizarDashboard() {
            document.getElementById('dashTotalNotas').innerText = obterDados('conteudos').length;
            let totalV = obterDados('vendas').reduce((acc, v) => acc + (v.qtd * v.preco), 0);
            document.getElementById('dashTotalVendas').innerText = totalV.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            let agenda = obterDados('agenda');
            let divAgenda = document.getElementById('dashProximoEvento');
            if (agenda.length > 0) {
                let ultimo = agenda[agenda.length - 1];
                let dataForm = ultimo.data.split('-').reverse().join('/');
                divAgenda.innerHTML = `<strong style="display:block; font-size: 0.9rem; margin-bottom: 2px;">${ultimo.desc}</strong>${dataForm}`;
            } else {
                divAgenda.innerHTML = 'Nenhum.';
            }
        }

        function salvarAgenda() {
            let data = document.getElementById('dataAgenda').value;
            let desc = document.getElementById('descAgenda').value;
            if (!data || !desc) return;
            let agenda = obterDados('agenda');
            agenda.push({ id: gerarId(), data, desc });
            salvarDados('agenda', agenda);
            document.getElementById('dataAgenda').value = '';
            document.getElementById('descAgenda').value = '';
            renderizarAgenda();
            atualizarDashboard();
        }

        function renderizarAgenda() {
            let div = document.getElementById('listaAgenda');
            let agenda = obterDados('agenda');
            div.innerHTML = agenda.length === 0 ? '<p style="color:var(--text-secundary);text-align:center;font-size:0.9rem;">Vazio.</p>' : '';
            agenda.slice().reverse().forEach(item => {
                let dataForm = item.data.split('-').reverse().join('/');
                div.innerHTML += `
                    <div class="item-salvo">
                        <strong>${item.desc}</strong><p>${dataForm}</p>
                        <div class="acoes-item">
                            <button class="btn-pequeno" onclick="abrirTelaEdicao('agenda', '${item.id}')">Editar</button>
                            <button class="btn-pequeno btn-excluir" onclick="excluirItem('agenda', '${item.id}')">Excluir</button>
                        </div>
                    </div>`;
            });
        }

        function salvarVenda() {
            let produto = document.getElementById('nomeProduto').value;
            let qtd = parseInt(document.getElementById('qtdProduto').value);
            let preco = parseFloat(document.getElementById('precoProduto').value);
            if (!produto || isNaN(qtd) || isNaN(preco)) return;
            let vendas = obterDados('vendas');
            vendas.push({ id: gerarId(), produto, qtd, preco });
            salvarDados('vendas', vendas);
            document.getElementById('nomeProduto').value = '';
            document.getElementById('qtdProduto').value = '';
            document.getElementById('precoProduto').value = '';
            renderizarVendas();
            atualizarDashboard();
        }

        function renderizarVendas() {
            let div = document.getElementById('listaVendas');
            let vendas = obterDados('vendas');
            div.innerHTML = vendas.length === 0 ? '<p style="color:var(--text-secundary);text-align:center;font-size:0.9rem;">Vazio.</p>' : '';
            vendas.slice().reverse().forEach(venda => {
                let totalBRL = (venda.qtd * venda.preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                let precoBRL = venda.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                div.innerHTML += `
                    <div class="item-salvo">
                        <strong>${venda.produto}</strong><p>${venda.qtd}x de ${precoBRL}</p>
                        <span class="destaque">${totalBRL}</span>
                        <div class="acoes-item">
                            <button class="btn-pequeno" onclick="abrir_tela_edicao_vendas" onclick="abrirTelaEdicao('vendas', '${venda.id}')">Editar</button>
                            <button class="btn-pequeno btn-excluir" onclick="excluirItem('vendas', '${venda.id}')">Excluir</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
